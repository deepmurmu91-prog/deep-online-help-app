name: Create Android Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore deep-online-help.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Deep Online Help, OU=Deep Online Help, O=Deep Online Help, L=Kolkata, ST=West Bengal, C=IN"

      - name: Encode keystore
        run: |
          base64 -w 0 deep-online-help.jks > keystore.base64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: deep-online-help-keystore
          path: keystore.base64
